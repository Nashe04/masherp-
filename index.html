<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ERP Activity Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout concept: a shop-floor control board. One header, two views (staff check-in, MD board).
   The MD board leads with four day totals, then one block per person with a 07:00-18:00 timeline
   where gaps in the day are visible as gaps. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#E8EDE9; --ink:#14221B; --muted:#586A5F; --line:#D3DCD5;
  --accent:#17694B; --accent-ink:#FFFFFF; --accent-soft:#D8EEE3;
  --warn:#9A5A00; --warn-bg:#FBEBCF; --bad:#A93428; --bad-bg:#F8DDD9;
  --c1:#2F7D6B; --c2:#3D6FB5; --c3:#8A5CB8; --c4:#C2652F; --c5:#B58A1F; --c6:#5E8C2F; --c7:#7A8790; --c0:#C3CBC6;
  --f-head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface2:#1F2B25; --ink:#E5EEE8; --muted:#8FA398; --line:#2B3A32;
  --accent:#4DBB8E; --accent-ink:#08140E; --accent-soft:#153326;
  --warn:#E6A53B; --warn-bg:#3A2B10; --bad:#E5786B; --bad-bg:#3B1A16;
  --c1:#4DB6A0; --c2:#6FA3E6; --c3:#B48BE0; --c4:#E58A55; --c5:#D8B04A; --c6:#8DBD55; --c7:#9AA6AE; --c0:#46544C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface2:#1F2B25; --ink:#E5EEE8; --muted:#8FA398; --line:#2B3A32;
  --accent:#4DBB8E; --accent-ink:#08140E; --accent-soft:#153326;
  --warn:#E6A53B; --warn-bg:#3A2B10; --bad:#E5786B; --bad-bg:#3B1A16;
  --c1:#4DB6A0; --c2:#6FA3E6; --c3:#B48BE0; --c4:#E58A55; --c5:#D8B04A; --c6:#8DBD55; --c7:#9AA6AE; --c0:#46544C;
  color-scheme:dark}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:.005em;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.tabs{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:8px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:16px 22px;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.staff{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
@media(max-width:820px){.staff{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 180px}
.timer{font-family:var(--f-head);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:500}
.chip:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:4px;flex:none;background:var(--c0)}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}.k5{background:var(--c5)}.k6{background:var(--c6)}.k7{background:var(--c7)}.k0{background:var(--c0)}
.log{display:flex;flex-direction:column}
.log .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.log .it:first-child{border-top:0}
.note ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.note{background:var(--accent-soft);border-color:transparent}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:500}
.banner .btn{background:transparent;border-color:currentColor;color:inherit;padding:6px 12px}
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:760px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tot b{font-family:var(--f-head);font-size:36px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.tot small{color:var(--muted)}
.people{display:flex;flex-direction:column;gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.ph .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 3px 10px;font-size:13px;font-weight:500;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.work{background:var(--accent-soft);color:var(--accent)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.none{background:transparent;border:1px dashed var(--line)}
.tl{position:relative;height:26px;border-radius:6px;background:var(--surface2);overflow:hidden}
.tl .span{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);border-left:2px solid var(--muted)}
.tl .seg{position:absolute;top:4px;bottom:4px;border-radius:3px;min-width:2px}
.tl .seg.k0{background:var(--c0)}
.tlaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-6px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 14px}
.metrics div{display:flex;flex-direction:column;min-width:0}
.metrics span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.metrics b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.metrics b.flag{color:var(--warn)}
.toggle{align-self:flex-start;font-size:13px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line);white-space:nowrap}
.where{display:flex;flex-direction:column;gap:10px}
.wrow{display:grid;grid-template-columns:130px minmax(0,1fr) 150px;gap:6px 12px;align-items:center}
.wrow .wl{grid-column:1;grid-row:1}.wrow .track{grid-column:2;grid-row:1}.wrow .wv{grid-column:3;grid-row:1;text-align:right}
@media(max-width:560px){.wrow{grid-template-columns:minmax(0,1fr) auto}.wrow .track{grid-column:1/-1;grid-row:2}.wrow .wv{grid-column:2}}
.track{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err{color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:500}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
footer{color:var(--muted);font-size:13px;max-width:78ch}
.hr{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
@media(max-width:560px){.hr{align-items:flex-start}}
.acct{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.insight{border-radius:12px;padding:12px 14px;background:var(--accent-soft);margin:0 0 14px}
.insight.flag{background:var(--warn-bg)}
.insight b{font-family:var(--f-head);font-size:22px;line-height:1.2;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:10px;border-radius:2px;display:inline-block}
@media(prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s,filter .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ SETTINGS: fill these two lines to share data live between devices ============
   Leave both empty and the page still works, but records stay in each browser only.
   Both values are in Supabase: Project Settings > API (Project URL and the "anon public" key). */
var SUPABASE_URL = "";
var SUPABASE_ANON_KEY = "";
/* Preview mode only (used while the two lines above are empty): a demonstration MD sign-in so you can try the flow.
   It is NOT secure, because anyone can read these lines in the page source. Real security needs the Supabase connection. */
var LOCAL_MD_EMAIL = "md@demo.local";
var LOCAL_MD_PASSWORD = "md123456";
/* ================================================================================== */

(function(){
"use strict";
var TASKS=[
 {n:"Fuel receipts",c:1},{n:"Invoices",c:2},{n:"Requisitions",c:3},{n:"HR records",c:4},
 {n:"Stock variances",c:5},{n:"Payroll entries",c:6},{n:"Other ERP work",c:7},{n:"Break",c:0}
];
var TMAP={};TASKS.forEach(function(t){TMAP[t.n]=t});
var SITES=["Head Office","Msasa","Poultry abattoir"];
var MIN=60000, AX0=7*60, AX1=18*60;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function hhmm(ms){var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dkey(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dkey(Date.now())}
function dstart(k){return new Date(k+"T00:00:00").getTime()}
function dur(ms){ms=Math.max(0,Math.round(ms/MIN));var h=Math.floor(ms/60),m=ms%60;return h?h+"h "+pad(m)+"m":m+"m"}
function clock(ms){ms=Math.max(0,Math.floor(ms/1000));var h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+":":"")+(h?pad(m):m)+":"+pad(s)}
function rid(){return Math.random().toString(36).slice(2,10)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function shiftDay(k,n){var d=new Date(dstart(k)+12*3600000);d.setDate(d.getDate()+n);return dkey(d.getTime())}

var sb=null;
try{if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){sb=null}
var REMOTE=!!sb;
var LOCAL_OK=false;try{LOCAL_OK=!REMOTE&&sessionStorage.getItem("erpad-md")==="1"}catch(e){}

var S={tab:"staff",day:today(),profile:lsGet("erpad-profile",null),uid:null,
  mine:lsGet("erpad-days",{}),      /* this device's own day records */
  days:{},                          /* records shown on the MD board */
  sampleOn:null,open:{},qty:"",err:"",ready:true,
  authState:REMOTE?"checking":(LOCAL_OK?"in":"out"),authMsg:"",user:LOCAL_OK?{email:LOCAL_MD_EMAIL}:null,role:LOCAL_OK?"md":null,emailVal:"",deniedMsg:"",channel:null,boardErr:""};
S.uid=lsGet("erpad-uid",null);if(!S.uid){S.uid="u"+rid()+rid();lsSet("erpad-uid",S.uid)}
if(!REMOTE)S.days=S.mine;

/* ---------- data layer ---------- */
function pushRemote(doc){
  if(!REMOTE)return;
  sb.rpc("erp_save_day",{p_uid:doc.uid,p_day:doc.day,p_name:doc.name,p_site:doc.site,p_doc:doc}).then(function(r){
    if(r&&r.error){S.err="Saved on this device, but could not reach the shared record: "+r.error.message;render()}
    else if(S.err&&/shared record/.test(S.err)){S.err="";render()}
  },function(){S.err="Saved on this device, but could not reach the shared record. It will retry on your next action.";render()});
}
function saveDoc(doc){
  S.mine[doc.id]=doc;lsSet("erpad-days",S.mine);
  if(!REMOTE)S.days=S.mine;
  pushRemote(doc);
  render();
}
function myDoc(){return S.mine[S.uid+"_"+today()]||null}

function loadBoard(){
  S.boardErr="";
  var from=shiftDay(today(),S.role==="md"?-800:-45),m={},off=0;
  function page(){
    return sb.from("erp_days").select("id,doc").gte("day",from).order("day").range(off,off+999).then(function(r){
      if(r.error){S.boardErr=r.error.message;render();return}
      (r.data||[]).forEach(function(x){if(x.doc){x.doc.id=x.id;m[x.id]=x.doc}});
      if((r.data||[]).length===1000&&off<20000){off+=1000;return page()}
      S.days=m;render();
    });
  }
  return page();
}
function subscribe(){
  if(S.channel)return;
  S.channel=sb.channel("erp-days").on("postgres_changes",{event:"*",schema:"public",table:"erp_days"},function(p){
    var row=p&&p.new;if(row&&row.id&&row.doc){row.doc.id=row.id;S.days[row.id]=row.doc;if((S.tab==="dash"||S.tab==="trends")&&!inputBusy())render()}
  }).subscribe();
}
function inputBusy(){var a=document.activeElement;return a&&(a.id==="dday"||a.id==="tperiod"||a.id==="tmetric"||a.id==="tperson"||a.id==="email"||a.id==="pw")}
function applySession(session){
  if(!session){S.authState="out";S.user=null;S.role=null;S.days={};if(S.channel){try{sb.removeChannel(S.channel)}catch(e){}S.channel=null}render();return}
  S.user=session.user;
  sb.from("erp_viewers").select("user_id,role").eq("user_id",session.user.id).maybeSingle().then(function(r){
    S.deniedMsg=r.error?r.error.message:"";if(r.error||!r.data){S.authState="denied";render();return}S.role=r.data.role==="md"?"md":"hr";
    S.authState="in";render();loadBoard().then(subscribe);
  });
}
function initAuth(){
  if(!REMOTE)return;
  sb.auth.getSession().then(function(r){applySession(r&&r.data&&r.data.session)},function(){S.authState="out";render()});
  sb.auth.onAuthStateChange(function(ev,session){if(ev==="SIGNED_OUT"){applySession(null)}});
}
function signIn(){
  var e=(document.getElementById("email").value||"").trim(),p=document.getElementById("pw").value||"";
  if(!e||!p){S.authMsg="Enter your email and password.";render();return}
  S.emailVal=e;
  if(!REMOTE){
    if(e.toLowerCase()===LOCAL_MD_EMAIL.toLowerCase()&&p===LOCAL_MD_PASSWORD){try{sessionStorage.setItem("erpad-md","1")}catch(x){}S.authState="in";S.role="md";S.user={email:LOCAL_MD_EMAIL};S.authMsg="";render()}
    else{S.authMsg="That email or password is not correct.";render()}
    return;
  }
  S.authMsg="Signing in…";render();
  sb.auth.signInWithPassword({email:e,password:p}).then(function(r){
    if(r.error){S.authMsg=r.error.message;render();return}
    S.authMsg="";applySession(r.data.session);
  },function(){S.authMsg="Could not reach the server. Check your connection.";render()});
}
function signOut(){
  S.tab="staff";S.emailVal="";
  if(!REMOTE){try{sessionStorage.removeItem("erpad-md")}catch(x){}S.authState="out";S.role=null;S.user=null;S.authMsg="";render();return}
  sb.auth.signOut().then(function(){S.authState="out";S.authMsg="";applySession(null)});
}

/* ---------- metrics ---------- */
function metrics(s,now){
  var past=s.day<today();
  var lastEnd=s.tasks.reduce(function(m,t){return Math.max(m,t.end||t.start)},s.start);
  var stop=s.end!=null?s.end:(past?lastEnd:now);
  var work=0,brk=0,items=0,itemMs=0,active=null;
  s.tasks.forEach(function(t){
    var e=t.end!=null?t.end:stop;var d=Math.max(0,e-t.start);
    if(t.type==="Break")brk+=d;else{work+=d;if(t.end!=null&&t.qty>0){items+=t.qty;itemMs+=d}}
    if(t.end==null&&s.end==null&&!past)active=t;
  });
  var onSys=Math.max(0,stop-s.start),un=Math.max(0,onSys-work-brk),avail=onSys-brk;
  var st;
  if(s.end!=null)st={k:"out",t:"Checked out"};
  else if(past)st={k:"out",t:"No check-out"};
  else if(active)st=active.type==="Break"?{k:"brk",t:"On break"}:{k:"work",t:"Working: "+active.type};
  else{var gap=now-lastEnd;st=gap>=15*MIN?{k:"wait",t:"No task for "+dur(gap)}:{k:"btw",t:"Between tasks"}}
  return {stop:stop,work:work,brk:brk,items:items,avg:items?itemMs/MIN/items:null,onSys:onSys,un:un,util:avail>0?work/avail:0,status:st,active:active};
}

/* ---------- sample data (clearly labelled in the UI) ---------- */
function sampleFor(day){
  var b=dstart(day),m=function(h,mm){return b+(h*60+mm)*MIN};
  var now=m(14,30);
  function S_(name,site,start,tasks){return {name:name,site:site,s:{id:"s_"+name,uid:"s_"+name,name:name,site:site,day:day,start:start,end:null,
    tasks:tasks.map(function(t,i){return {id:"t"+i,type:t[0],start:t[1],end:t[2],qty:t[3]}})}}}
  var list=[
   S_("Blessing M.","Msasa",m(8,3),[["Fuel receipts",m(8,10),m(9,55),23],["Stock variances",m(10,0),m(10,50),5],["Break",m(10,50),m(11,5),null],["Invoices",m(11,10),m(13,0),31],["Break",m(13,0),m(13,45),null],["Fuel receipts",m(13,50),null,null]]),
   S_("Tendai C.","Head Office",m(8,20),[["HR records",m(8,30),m(10,30),14],["Requisitions",m(10,40),m(12,0),9],["Break",m(12,30),m(13,15),null]]),
   S_("Rudo K.","Head Office",m(7,52),[["Invoices",m(8,0),m(12,0),46],["Break",m(12,0),m(12,45),null],["Invoices",m(12,50),null,null]]),
   S_("Farai N.","Msasa",m(8,41),[["Fuel receipts",m(8,50),m(9,40),9],["Requisitions",m(11,30),m(12,15),4]]),
   S_("Chipo D.","Head Office",m(8,5),[["Payroll entries",m(8,15),m(11,40),27],["Break",m(11,40),m(12,0),null],["Payroll entries",m(12,5),null,null]]),
   {name:"Tafadzwa Z.",site:"Msasa",s:null}
  ];
  return {now:now,list:list};
}

/* ---------- render: staff ---------- */

/* ---------- trends (week / month / year) ---------- */
var T={period:"week",metric:"items",person:"all",sample:null,cache:null};
var METRICS={items:{l:"Items handled",better:1},hours:{l:"Hours on tasks",better:1},util:{l:"Time on tasks (% of shift, excl. breaks)",better:1},mpu:{l:"Minutes per item",better:-1}};
function monOf(k){var d=new Date(dstart(k)+12*3600000),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dkey(d.getTime())}
function bucketKey(day,p){return p==="week"?monOf(day):p==="month"?day.slice(0,7):day.slice(0,4)}
function bucketList(p){
  var out=[],t=today();
  if(p==="week"){var k=monOf(t);for(var i=0;i<10;i++){out.unshift(k);k=shiftDay(k,-7)}}
  else if(p==="month"){var y=+t.slice(0,4),m=+t.slice(5,7);for(var j=0;j<12;j++){out.unshift(y+"-"+pad(m));m--;if(m<1){m=12;y--}}}
  else{var yy=+t.slice(0,4);for(var q=2;q>=0;q--)out.push(""+(yy-q))}
  return out;
}
function bucketLabel(k,p,last){
  var s;
  if(p==="week"){var d=new Date(dstart(k)+12*3600000);s=d.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}
  else if(p==="month"){s=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+k.slice(5)-1]+" "+k.slice(2,4)}
  else s=k;
  return s;
}
function sampleHistory(){
  if(T.cache)return T.cache;
  var names=[["Blessing M.","Msasa",1.0,0.004],["Tendai C.","Head Office",0.85,0.002],["Rudo K.","Head Office",1.15,0.001],["Farai N.","Msasa",0.7,0.006],["Chipo D.","Head Office",0.95,-0.001]];
  var docs={},t0=dstart(today()),seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var back=420;back>=1;back--){
    var day=dkey(t0-back*86400000),dow=new Date(dstart(day)+12*3600000).getDay();if(dow===0||dow===6)continue;
    names.forEach(function(p,i){
      if(rnd()<0.06)return;
      var base=dstart(day),prog=(420-back)/420,eff=p[2]*(1+p[3]*(420-back)/7*0.35+(rnd()-.5)*.18);
      var st=base+(8*60+Math.round(rnd()*25))*MIN,cur=st+10*MIN,tasks=[];
      [[TASKS[i%3].n,150],[TASKS[(i+1)%3].n,130],["Break",40],[TASKS[(i+2)%3].n,120]].forEach(function(x){
        var d=Math.round(x[1]*(0.9+rnd()*.2))*MIN,e=cur+d;
        tasks.push({id:"s",type:x[0],start:cur,end:e,qty:x[0]==="Break"?null:Math.round(d/MIN*0.2*eff*(0.9+rnd()*.2))});cur=e+Math.round(rnd()*8)*MIN});
      var id="h_"+i+"_"+day;docs[id]={id:id,uid:"h"+i,name:p[0],site:p[1],day:day,start:st,end:cur,tasks:tasks};
    });
  }
  T.cache=docs;return docs;
}
function aggregate(src,p){
  var B={},now=Date.now();
  Object.keys(src).forEach(function(k){
    var d=src[k];if(!d||!d.tasks)return;
    var bk=bucketKey(d.day,p),m=metrics(d,now),who=d.name;
    [who,"__all__"].forEach(function(w){
      var o=(B[w]=B[w]||{})[bk]||(B[w][bk]={work:0,brk:0,onSys:0,items:0,itemMs:0,days:0});
      o.work+=m.work;o.brk+=m.brk;o.onSys+=m.onSys;o.days++;
      d.tasks.forEach(function(t){if(t.type!=="Break"&&t.end!=null&&t.qty>0){o.items+=t.qty;o.itemMs+=t.end-t.start}});
    });
  });
  return B;
}
function mval(o,m){
  if(!o||!o.days)return null;
  if(m==="items")return o.items;
  if(m==="hours")return o.work/3600000;
  if(m==="util"){var a=o.onSys-o.brk;return a>0?o.work/a*100:null}
  return o.items>0?o.itemMs/MIN/o.items:null;
}
function fmt(v,m){if(v==null)return "–";return m==="items"?String(Math.round(v)):m==="util"?Math.round(v)+"%":v.toFixed(1)}
function fmtU(v,m){if(v==null)return "–";return m==="items"?String(Math.round(v)):m==="util"?Math.round(v)+"%":m==="hours"?v.toFixed(1)+"h":v.toFixed(1)+" min"}
function chart(vals,labels,m){
  var W=680,H=270,L=50,R=80,Tp=20,Bt=34,n=vals.length,mx=0,ch=H-Tp-Bt,done=[],F="IBM Plex Mono,monospace";
  vals.forEach(function(v,i){if(v!=null&&v>mx)mx=v;if(v!=null&&i<n-1)done.push([i,v])});
  if(!mx)mx=1;
  var raw=mx/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag;
  var step=(m==="items"?(r<=1?1:r<=2?2:r<=5?5:10):(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10))*mag;
  var top=step*Math.ceil(mx/step-1e-9),bw=(W-L-R)/n;
  function Y(v){return Tp+ch*(1-v/top)}
  function X(i){return L+i*bw+bw/2}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trend chart: '+esc(METRICS[m].l)+' by period" style="width:100%;min-width:560px;height:auto;display:block">';
  for(var gv=0;gv<=top+step/1000;gv+=step){var y=Y(gv);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="'+F+'">'+fmtU(gv,m)+'</text>'}
  vals.forEach(function(v,i){
    var w=bw*0.62,x=X(i)-w/2,cur=i===n-1;
    if(v!=null){var bh=ch*v/top,yy=Y(v);
      s+='<rect x="'+x+'" y="'+yy+'" width="'+w+'" height="'+bh+'" rx="3" fill="var(--accent)"'+(cur?' fill-opacity=".35" stroke="var(--accent)" stroke-dasharray="4 3"':'')+'><title>'+esc(labels[i]+": "+fmtU(v,m)+(cur?" (so far)":""))+'</title></rect>';
      if(n<=12)s+='<text x="'+X(i)+'" y="'+(yy-5)+'" text-anchor="middle" font-size="'+(n>10?10:11)+'" font-weight="500" fill="var(--ink)" font-family="'+F+'">'+fmtU(v,m)+'</text>'}
    s+='<text x="'+X(i)+'" y="'+(H-Bt+17)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="'+F+'">'+esc(labels[i])+'</text>';
  });
  if(done.length>=2){var sum=0;done.forEach(function(d){sum+=d[1]});var av=sum/done.length,ya=Y(av);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ya+'" y2="'+ya+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="'+(W-R+6)+'" y="'+(ya+4)+'" font-size="11" fill="var(--muted)" font-family="'+F+'">Avg '+fmtU(av,m)+'</text>'}
  if(done.length>=3){var k=done.length,sx=0,sy=0,sxy=0,sxx=0;done.forEach(function(d){sx+=d[0];sy+=d[1];sxy+=d[0]*d[1];sxx+=d[0]*d[0]});
    var den=k*sxx-sx*sx;
    if(den){var sl=(k*sxy-sx*sy)/den,ic=(sy-sl*sx)/k,i0=done[0][0],i1=done[k-1][0],cl=function(v){return Y(Math.max(0,Math.min(top,v)))};
      s+='<line x1="'+X(i0)+'" y1="'+cl(ic+sl*i0)+'" x2="'+X(i1)+'" y2="'+cl(ic+sl*i1)+'" stroke="var(--c4)" stroke-width="3" stroke-linecap="round"/>'}}
  return s+'</svg>';
}
function legendHtml(p){
  return '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Completed '+p+'</span><span><i class="sw" style="background:var(--accent);opacity:.35"></i>This '+p+' so far</span><span><i class="sw" style="height:0;border-top:2px dashed var(--muted)"></i>Average</span><span><i class="sw" style="height:0;border-top:3px solid var(--c4)"></i>Overall direction</span></div>';
}
function insight(vals,m,p){
  var n=vals.length,a=vals[n-2],b=vals[n-3],who=T.person==="all"?"Team":T.person;
  var nm={items:"items handled",hours:"hours on tasks",util:"time on tasks",mpu:"minutes per item"}[m];
  if(a==null||b==null||!(b>0))return '<div class="insight"><span class="muted">Not enough completed '+p+'s yet to say whether '+nm+' is going up or down. This fills in as staff check in over more '+p+'s.</span></div>';
  var pc=(a-b)/b*100,flat=Math.abs(pc)<2,good=(pc>=0)===(METRICS[m].better>0);
  var head=who+": "+nm+" "+(flat?"holding steady":(pc>0?"up ":"down ")+Math.abs(pc).toFixed(0)+"%");
  var tag=flat?"No real change":(good?"Good news":"Worth a look");
  return '<div class="insight'+(!flat&&!good?" flag":"")+'"><b>'+esc(head)+'</b><div style="margin-top:2px">'+tag+'. Last full '+p+': '+fmtU(a,m)+'. The '+p+' before: '+fmtU(b,m)+'.</div></div>';
}
function renderTrends(){
  if(S.authState!=="in")return gate();
  if(S.role!=="md")return '<div class="panel stack" style="max-width:520px"><h2>Trends are for the MD only</h2><p class="muted" style="margin:0">Your account can open the MD board, but the trends view is limited to the MD.</p></div>';var real=Object.keys(S.days).length>0,useS=T.sample==null?!real:T.sample,src=useS?sampleHistory():S.days;
  var p=T.period,m=T.metric,B=aggregate(src,p),bl=bucketList(p);
  var people=Object.keys(B).filter(function(k){return k!=="__all__"}).sort();
  if(T.person!=="all"&&people.indexOf(T.person)<0)T.person="all";
  var sel=T.person==="all"?"__all__":T.person,row=B[sel]||{};
  var labels=bl.map(function(k,i){return bucketLabel(k,p)+(i===bl.length-1?"*":"")});
  var vals=bl.map(function(k){return mval(row[k],m)});
  var h='<div class="bar"><div class="row" style="gap:10px">'+
    '<div class="field"><label class="label" for="tperiod">Period</label><select id="tperiod"><option value="week"'+(p==="week"?" selected":"")+'>Weekly (last 10 weeks)</option><option value="month"'+(p==="month"?" selected":"")+'>Monthly (last 12 months)</option><option value="year"'+(p==="year"?" selected":"")+'>Yearly (last 3 years)</option></select></div>'+
    '<div class="field"><label class="label" for="tmetric">Measure</label><select id="tmetric">'+Object.keys(METRICS).map(function(k){return '<option value="'+k+'"'+(k===m?" selected":"")+'>'+esc(METRICS[k].l)+'</option>'}).join("")+'</select></div>'+
    '<div class="field"><label class="label" for="tperson">Employee</label><select id="tperson"><option value="all">All staff</option>'+people.map(function(n){return '<option'+(n===T.person?" selected":"")+'>'+esc(n)+'</option>'}).join("")+'</select></div></div>'+
    '<div class="row" style="gap:8px">'+(REMOTE?'<span class="live">Live</span>':'')+''+'</div></div>';
  if(S.boardErr)h+='<div class="banner"><span>Could not load records: '+esc(S.boardErr)+'</span><button class="btn" data-act="reload">Try again</button></div>';
  if(useS)h+='<div class="banner"><span>Sample history. These are example staff, not real records.</span>'+(real?'<button class="btn" data-act="tReal">Show real data</button>':'<span style="font-weight:400">Real trends appear here once staff have checked in over several days.</span>')+'</div>';
  else if(T.sample===false)h+='<div class="banner"><span>Showing real data.</span><button class="btn" data-act="tSample">Show sample data</button></div>';
  h+='<div class="panel"><h2 style="margin-bottom:4px">'+esc(METRICS[m].l)+': '+(T.person==="all"?"all staff":esc(T.person))+'</h2><p class="muted" style="margin:0 0 12px;font-size:13px">'+(m==="items"||m==="hours"?"Totals per ":"Average per ")+p+'. '+(METRICS[m].better>0?"Higher is better.":"Lower is better.")+' * marks the current period, which is still in progress.</p>'+insight(vals,m,p)+'<div class="tablewrap">'+chart(vals,labels,m)+'</div>'+legendHtml(p)+'</div>';
  /* table */
  var cols=bl.length>8&&window.innerWidth<700?bl.slice(-6):bl;
  h+='<div class="panel"><h2 style="margin-bottom:12px">By employee</h2><div class="tablewrap"><table><thead><tr><th>Employee</th>'+cols.map(function(k){return '<th>'+esc(bucketLabel(k,p))+(k===bl[bl.length-1]?"*":"")+'</th>'}).join("")+'<th>Change</th></tr></thead><tbody>';
  (people.length?["__all__"].concat(people):[]).forEach(function(w){
    var r=B[w]||{},vs=bl.map(function(k){return mval(r[k],m)});
    var cur=vs[vs.length-1],prev=vs[vs.length-2],ch="–",cl="";
    if(bl.length>2&&vs.length>=3){ /* compare last COMPLETED period to the one before, so partial periods do not mislead */
      var a=vs[vs.length-2],b=vs[vs.length-3];
      if(a!=null&&b!=null&&b>0){var pc=(a-b)/b*100;ch=(Math.abs(pc)<0.5?"● 0%":(pc>0?"▲ +":"▼ ")+pc.toFixed(0)+"%");var good=(pc>=0)===(METRICS[m].better>0);cl=Math.abs(pc)<3?"":(good?"":"flag")}}
    h+='<tr><td><b style="font-weight:'+(w==="__all__"?600:500)+'">'+(w==="__all__"?"All staff":esc(w))+'</b></td>'+cols.map(function(k){return '<td class="mono">'+fmt(mval(r[k],m),m)+'</td>'}).join("")+'<td class="mono"><span class="'+cl+'" style="'+(cl?"color:var(--warn)":"")+'">'+ch+'</span></td></tr>';
  });
  h+='</tbody></table></div><p class="muted" style="margin:10px 0 0;font-size:13px">Change compares the last completed '+p+' with the one before it. Employees with few working days in a period will show lower totals; use the time-on-tasks and minutes-per-item measures to compare fairly.</p></div>';
  return h;
}

/* ---------- shell ---------- */
function isMD(){return S.authState==="in"&&S.role==="md"}
function acct(){
  if(S.authState==="in")return '<div class="acct"><span class="pill work">'+(S.role==="md"?"MD":"HR")+'</span><span class="muted" style="font-size:13px">'+esc(S.user&&S.user.email||"")+'</span><button class="btn quiet" data-act="signOut">Sign out</button></div>';
  if(S.authState==="denied")return '<div class="acct"><span class="muted" style="font-size:13px">'+esc(S.user&&S.user.email||"")+'</span><button class="btn quiet" data-act="signOut">Sign out</button></div>';
  return '<div class="acct"><button class="btn" data-act="mdSignIn">MD sign in</button></div>';
}
function render(){
  var app=document.getElementById("app");if(!app)return;
  var focusId=document.activeElement&&document.activeElement.id,sel=null;
  try{if(document.activeElement&&document.activeElement.selectionStart!=null)sel=[document.activeElement.selectionStart,document.activeElement.selectionEnd]}catch(e){}
  var y=window.scrollY;
  var h='<header class="top"><div class="brand"><h1>ERP Activity Dashboard</h1><p>A companion to the ERP that shows when staff are on the system, what they work on and how much they capture.</p></div>'+
    '<div class="hr">'+acct()+'<div class="tabs" role="group" aria-label="View"><button data-act="tab" data-t="staff" aria-pressed="'+(S.tab==="staff")+'">Staff check-in</button><button data-act="tab" data-t="dash" aria-pressed="'+(S.tab==="dash")+'">MD board</button>'+(isMD()?'<button data-act="tab" data-t="trends" aria-pressed="'+(S.tab==="trends")+'">Trends</button>':'')+'</div></div></header>';
  h+=S.tab==="staff"?renderStaff():S.tab==="trends"?renderTrends():renderDash();
  h+='<footer>'+(REMOTE?'Records are shared live. Only people on the viewer list can open the MD board, and only the MD can open Trends. ':'Records are kept in this browser only, because no shared database is connected yet. ')+'Times and item counts come from staff check-ins; the page does not watch screens or keystrokes.</footer>';
  app.innerHTML=h;
  if(focusId){var el=document.getElementById(focusId);if(el){el.focus();try{if(sel&&el.setSelectionRange&&el.type!=="number"&&el.type!=="email")el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  window.scrollTo(0,y);
  tick();
}
function tick(){
  var now=Date.now();
  document.querySelectorAll("[data-live]").forEach(function(el){
    var p=el.getAttribute("data-live").split(":");
    if(p[0]==="clock")el.textContent=clock(now-+p[1]);
    else if(p[0]==="sys")el.textContent=dur((p[2]?+p[2]:now)-+p[1]);
  });
}
setInterval(tick,1000);
setInterval(function(){if(S.tab==="dash"&&!document.hidden&&!inputBusy()&&S.authState==="in")render()},30000);

/* ---------- actions ---------- */
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
  var rows=[["Date","Name","Site","Check-in","Check-out","Task","Task start","Task end","Minutes","Items"]];
  dayDocs(S.day).forEach(function(d){var m=metrics(d,Date.now());
    if(!d.tasks.length)rows.push([d.day,d.name,d.site,hhmm(d.start),d.end!=null?hhmm(d.end):"","","","","",""]);
    d.tasks.forEach(function(t){var e=t.end!=null?t.end:m.stop;rows.push([d.day,d.name,d.site,hhmm(d.start),d.end!=null?hhmm(d.end):"",t.type,hhmm(t.start),t.end!=null?hhmm(t.end):"",Math.round(Math.max(0,e-t.start)/MIN),t.type==="Break"?"":(t.qty==null?"":t.qty)])});
  });
  var csv="﻿"+rows.map(function(r){return r.map(csvCell).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="erp-activity-"+S.day+".csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),now=Date.now(),d=myDoc();
  if(a==="tab"){S.tab=b.getAttribute("data-t");render()}
  else if(a==="saveProfile"){var n=(document.getElementById("pname").value||"").trim();if(!n){document.getElementById("pname").focus();return}
    S.profile={name:n.slice(0,60),site:document.getElementById("psite").value};lsSet("erpad-profile",S.profile);render()}
  else if(a==="editProfile"){S.profile=null;render()}
  else if(a==="checkIn"){if(d)return;saveDoc({id:S.uid+"_"+today(),uid:S.uid,name:S.profile.name,site:S.profile.site,day:today(),start:now,end:null,tasks:[]})}
  else if(a==="startTask"){if(!d||d.end!=null)return;var c=JSON.parse(JSON.stringify(d));c.tasks.push({id:rid(),type:b.getAttribute("data-t"),start:now,end:null,qty:null});S.qty="";S.err="";saveDoc(c)}
  else if(a==="endTask"){if(!d)return;var c2=JSON.parse(JSON.stringify(d)),t=c2.tasks.filter(function(x){return x.end==null})[0];if(!t)return;
    if(t.type!=="Break"){var q=document.getElementById("qty"),v=q?q.value.trim():"";if(v===""||isNaN(+v)||+v<0||Math.floor(+v)!==+v){S.err="Enter how many items you captured (0 or more).";render();return}t.qty=+v}
    t.end=now;S.qty="";S.err="";saveDoc(c2)}
  else if(a==="checkOut"){if(!d)return;var c3=JSON.parse(JSON.stringify(d));c3.end=now;saveDoc(c3)}
  else if(a==="prev"){S.day=shiftDay(S.day,-1);render()}
  else if(a==="next"){S.day=shiftDay(S.day,1);render()}
  else if(a==="todayBtn"){S.day=today();render()}
  else if(a==="toggle"){var id=b.getAttribute("data-id");S.open[id]=!S.open[id];render()}
  else if(a==="realData"){S.sampleOn=false;render()}
  else if(a==="sampleData"){S.sampleOn=true;render()}
  else if(a==="csv"){exportCsv()}
  else if(a==="signIn"){signIn()}
  else if(a==="mdSignIn"){S.tab="dash";render();var em=document.getElementById("email");if(em)em.focus()}
  else if(a==="signOut"){signOut()}
  else if(a==="reload"){loadBoard()}
  else if(a==="tReal"){T.sample=false;render()}
  else if(a==="tSample"){T.sample=true;render()}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&(ev.target.id==="pw"||ev.target.id==="email"))signIn()});
document.addEventListener("input",function(ev){if(ev.target.id==="qty")S.qty=ev.target.value});
document.addEventListener("change",function(ev){var i=ev.target.id;if(i==="tperiod"){T.period=ev.target.value;render();return}if(i==="tmetric"){T.metric=ev.target.value;render();return}if(i==="tperson"){T.person=ev.target.value;render();return}if(ev.target.id==="dday"&&ev.target.value){S.day=ev.target.value;render()}});

render();initAuth();
})();
</script>
